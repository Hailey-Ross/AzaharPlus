# Builds AzaharPlus for Windows as its own releases are built (MSYS2 Clang64, inside build\), without its
# system-file downloader, and publishes it for the nativeMons launcher. No games, keys or system files are included.
name: Windows release

on:
  push:
    branches: [hails-additions]
    paths-ignore: ["**.md", "dist/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-release
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 180
    defaults:
      run:
        shell: msys2 {0}
    env:
      # The upstream release hails-additions follows (update it with each sync to a new tag).
      UPSTREAM_TAG: AZAHAR_PLUS_2126_2_A
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_SLOPPINESS: time_macros
    steps:
      - name: Disable line ending translation
        shell: bash
        run: git config --global core.autocrlf input
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Restore the compile cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-msys2-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-msys2-
      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: clang64
          update: true
          install: git make p7zip
          pacboy: >-
            toolchain:p ccache:p cmake:p ninja:p spirv-tools:p zlib:p SDL2:p
            qt6-base:p qt6-multimedia:p qt6-multimedia-wmf:p qt6-tools:p qt6-translations:p
      - name: Build
        # Inside build\, as AzaharPlus's own build/winconf does (its .ci/windows.sh can't: build\ already exists).
        # FFmpeg only serves its video dumper. Newer MSYS2 headers: dynarmic needs <vector> and httplib <exception>
        # included for them, and libressl's htobe32/64 are plain byte swaps on x86-64.
        # MSYS2's own SDL2: the bundled one, built here, saw no controller at all (no "Device added" in the log).
        run: |
          cd build
          cmake .. -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DENABLE_QT_TRANSLATION=ON -DENABLE_FFMPEG=OFF -DUSE_SYSTEM_SDL2=ON -DENABLE_TESTS=OFF -DCMAKE_CXX_FLAGS="-include vector -include exception" -DCMAKE_C_FLAGS="-Dhtobe32=__builtin_bswap32 -Dhtobe64=__builtin_bswap64"
          ninja -k 0
          ninja bundle
          strip -s bundle/*.exe
          ccache -s
      - name: Save the compile cache
        # Saved even when the build fails, so a retry doesn't start cold.
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-msys2-${{ github.sha }}

      - name: Package
        shell: bash
        run: |
          rm -rf dist && mkdir -p dist/azaharplus
          cp -r build/bundle/* dist/azaharplus/
          ls dist/azaharplus/*.exe
          cp LICENSE.txt dist/azaharplus/LICENSE-azaharplus.txt
          # The notices AzaharPlus's own package carries (its build/winpack).
          cp the_azahar_logo_is_the_property_of_PabloMK7_and_angyartanddraw.txt dist/azaharplus/
          cp externals/libzip/LICENSE dist/azaharplus/libzip_license.txt
          printf 'AzaharPlus-modified (nativeMons), without its system-file downloader\nBased on AzaharPlus %s (https://github.com/AzaharPlus/AzaharPlus)\nSource: https://github.com/%s/tree/%s\n' \
            "$UPSTREAM_TAG" "$GITHUB_REPOSITORY" "$GITHUB_SHA" > dist/azaharplus/NATIVEMONS-BUILD.txt
          if find dist -iregex '.*\.\(3ds\|cci\|cia\|cxi\|app\|sav\)$' | grep .; then echo "Game data in the package"; exit 1; fi
          (cd dist && powershell -NoProfile -Command "Compress-Archive -Path azaharplus -DestinationPath azaharplus-nativemons-windows-x64.zip")
          ls -la dist

      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="windows-${GITHUB_SHA:0:9}"
          gh release create "$tag" dist/azaharplus-nativemons-windows-x64.zip \
            --target "$GITHUB_SHA" --title "Windows build ($tag)" \
            --notes "AzaharPlus-modified (nativeMons), based on AzaharPlus $UPSTREAM_TAG, without its system-file downloader, for the nativeMons launcher. Built from this commit; source and license are in this repository. No games, keys or system files are included."
